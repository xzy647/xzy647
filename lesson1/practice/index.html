<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>菜单</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        .large {
            border: 1px solid #dddddd;
            border-radius: 5px;
           padding: 2px 16px;
            width: 1590px;
            height: 86px;
            background-color: #fff;
            margin: 20px auto;
            line-height: 24px;
        }
        h2 {
            margin: 22px 32px;
           font-size: 34px;
            
        }
        .cai {
            color: #333;
            font-weight: 700;
            font-size: 20px;
        }
        .miao {
            font-size: 12px;
            color: #55558c;
        }
        .qian {
            color: #007bff;
            font-weight: 700;
            font-size: 16px;
        }
        .sh {
           background-color: #007bff;
            margin: 0 34px;
            height: 3px;
        }
    </style>
</head>
<body>
    <h2>前菜</h2>
    <div class="large">
        <div class="cai">沙拉</div>
        <div class="miao">新鲜的蔬菜和橄榄油，简单而美味</div>
        <div class="qian">￥28</div>
    </div>
    <div class="large">
        <div class="cai">汤</div>
        <div class="miao">经典的番茄汤，口感浓郁</div>
        <div class="qian">￥18</div>
    </div>
    <hr class="sh">
    <h2>主菜</h2>
    <div class="large">
        <div class="cai">牛排</div>
        <div class="miao">外焦里嫩的烤牛排，搭配特别的酱汁</div>
        <div class="qian">￥88</div>
    </div>
    <div class="large">
        <div class="cai">海鲜意面</div>
        <div class="miao">新鲜意面与海鲜结合，口感丰富</div>
        <div class="qian">￥98</div>
    </div>
    <hr class="sh">
    <h2 >甜点</h2>
    <div class="large">
        <div class="cai">巧克力蛋糕</div>
        <div class="miao">香浓的巧克力蛋糕，配上香草冰淇淋</div>
        <div class="qian">￥38</div>
    </div>
    <div class="large">
        <div class="cai">水果沙拉</div>
        <div class="miao">新鲜水果，清爽健康</div>
        <div class="qian">￥22</div>
    </div>

</body>
</html>
